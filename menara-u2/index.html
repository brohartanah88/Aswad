      const tl = gsap.timeline({ paused: true });
      const cam = (id) => "#cam-" + id;

      tl.fromTo(cam("lobby"), { y: 900 }, { y: 0, duration: 0.32, ease: "expo.out" }, 3.0);
      tl.fromTo(cam("lobby"), { scale: 1.0 }, { scale: 1.08, duration: 2.4, ease: "none" }, 3.0);
      // 5.0 lobby -> living : horizontal whip left

      tl.fromTo(cam("living"), { x: 1100 }, { x: 0, duration: 0.3, ease: "expo.out" }, 5.4);
      // 7.2 living -> dining : horizontal whip right

      tl.fromTo(cam("dining"), { x: -1100 }, { x: 0, duration: 0.3, ease: "expo.out" }, 7.2);
      // 9.2 dining -> bed1 : zoom through

      tl.fromTo(cam("bed1"), { scale: 1.3 }, { scale: 1.0, duration: 0.4, ease: "expo.out" }, 9.2);
      // 11.2 bed1 -> bed2 : whip left

      tl.fromTo(cam("bed2"), { x: 1100 }, { x: 0, duration: 0.3, ease: "expo.out" }, 11.2);
      // 13.0 bed2 -> bath : zoom through

      tl.fromTo(cam("bath"), { scale: 1.3 }, { scale: 1.0, duration: 0.4, ease: "expo.out" }, 13.0);
      // 14.6 specs / 18.6 facilities / 22.6 fit : slow drift under the panels

      tl.fromTo(cam("facil"), { scale: 1.05 }, { scale: 1.15, duration: 4.0, ease: "power1.in" }, 18.6);

      tl.fromTo("#cam-cta-in", { y: 0 }, { y: -560, duration: 0.7, ease: "power3.inOut" }, 28.4);
